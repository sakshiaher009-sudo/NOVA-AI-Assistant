[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nova-backend"
version = "1.0.0"
description = "NOVA — Local AI Voice Agent Backend"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",

    # AI/ML
    "httpx>=0.27.0",

    # NLP
    "dateparser>=1.2.0",
    "regex>=2024.4.0",

    # RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",

    # Speech
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "numpy>=1.26.0",

    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0.0",
]
stt-fallback = [
    "openai-whisper>=20231117",
]
tts = [
    "piper-tts>=1.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
all = [
    "nova-backend[stt,tts,dev]",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
